name: tests
on:
  push:
    paths: ["harness/**", "strategies/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q pandas numpy pytest
      - run: python -m pytest -q
