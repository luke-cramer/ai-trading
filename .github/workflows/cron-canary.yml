name: cron-canary
# Temporary: proves GitHub's scheduler fires for this repo. Delete once carry-ingest runs on schedule.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "canary fired at $(date -u)"
